<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathPulse Demo</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        .demo-info {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            z-index: 1000;
            max-width: 250px;
        }
    </style>
</head>
<body>
    <div id="app" class="app-container"></div>

    <div class="demo-info">
        <strong>🚀 MathPulse Demo</strong>
        <ul style="margin-top: 0.5rem; list-style: none; padding: 0;">
            <li>✓ Home screen</li>
            <li>✓ Universe (rocket + planets)</li>
            <li>✓ Discovery animation</li>
            <li>✓ Game flow</li>
            <li>✓ Results + stars</li>
            <li>✓ Parent dashboard</li>
        </ul>
        <p style="margin-top: 1rem; font-size: 0.75rem; opacity: 0.7;">
            Open DevTools (F12) to see console logs
        </p>
    </div>

    <script src="js/utils/dom.js"></script>
    <script src="js/utils/math.js"></script>
    <script src="js/utils/random.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/progression.js"></script>
    <script src="js/core/session.js"></script>
    <script src="js/core/engine.js"></script>
    <script src="js/content/operations.js"></script>
    <script src="js/content/skills.js"></script>
    <script src="js/content/exercises.js"></script>
    <script src="js/games/baseGame.js"></script>
    <script src="js/games/numeric.js"></script>
    <script src="js/games/multiple.js"></script>
    <script src="js/games/missing.js"></script>
    <script src="js/games/series.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/ui/animations.js"></script>
    <script src="js/ui/universe.js"></script>
    <script src="js/ui/discovery.js"></script>
    <script src="js/ui/screen.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Demo utilities
        console.log('🚀 MathPulse Demo loaded');
        console.log('Available commands:');
        console.log('  • window.mathpulse.screenManager.show("home")');
        console.log('  • window.mathpulse.screenManager.show("universe")');
        console.log('  • window.mathpulse.screenManager.startSession()');
        console.log('  • window.mathpulse.progression.getTotalStars()');
        console.log('  • window.mathpulse.progression.reset()');
    </script>

</html>
