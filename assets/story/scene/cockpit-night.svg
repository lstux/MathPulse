<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" preserveAspectRatio="xMidYMid slice">
  <title>Le poste de pilotage la nuit</title>
  <desc>Le poste de pilotage. Par la grande vitre, un ciel de nuit plein d'étoiles.</desc>
  <style>@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}40%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.tw circle{animation:tw 2.6s ease-in-out infinite alternate}.tw circle:nth-child(3n){animation-duration:3.4s;animation-delay:-1s}.tw circle:nth-child(3n+1){animation-duration:2.1s;animation-delay:-.4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><path id="pine" d="M0 -62 L15 -32 H8 L21 -8 H10 L25 18 H-25 L-10 -8 H-21 L-8 -32 H-15Z M-4 18 H4 V34 H-4Z"/><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f3d"/><stop offset="1" stop-color="#262c58"/></linearGradient><linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3668"/><stop offset="1" stop-color="#1b1f3d"/></linearGradient><linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2370"/><stop offset=".6" stop-color="#6a4fc0"/><stop offset="1" stop-color="#d0689c"/></linearGradient><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e0d2b"/><stop offset="1" stop-color="#232a7a"/></linearGradient><radialGradient id="halo"><stop offset="0" stop-color="#ffd54a" stop-opacity=".4"/><stop offset="1" stop-color="#ffd54a" stop-opacity="0"/></radialGradient></defs>
  <rect width="360" height="240" fill="url(#wall)"/>
  <rect y="190" width="360" height="50" fill="url(#floor)"/>
  <g stroke="#323a72" stroke-width="2" fill="none"><path d="M0 24 H360"/><path d="M40 0 V24 M320 0 V24"/></g>
  <circle cx="28" cy="46" r="6" fill="#a23a4a"/><circle cx="28" cy="46" r="13" fill="#a23a4a" opacity=".2"/>
  <rect x="76" y="32" width="208" height="88" rx="14" fill="url(#night)"/><g class="tw" fill="#fff" opacity=".9"><circle cx="92" cy="46" r="1.3"/><circle cx="116" cy="66" r="1"/><circle cx="140" cy="42" r="1.2"/><circle cx="168" cy="60" r="1"/><circle cx="196" cy="40" r="1.3"/><circle cx="222" cy="62" r="1"/><circle cx="250" cy="44" r="1.2"/><circle cx="270" cy="70" r="1"/><circle cx="104" cy="88" r="1"/><circle cx="150" cy="84" r="1"/><circle cx="210" cy="86" r="1.2"/><circle cx="244" cy="92" r="1"/></g><circle cx="262" cy="56" r="9" fill="#fdf1c4"/><use href="#pine" transform="translate(96 112) scale(0.9)" fill="#1c3b48"/><use href="#pine" transform="translate(130 112) scale(0.7)" fill="#1c3b48"/><use href="#pine" transform="translate(240 112) scale(0.9)" fill="#1c3b48"/><use href="#pine" transform="translate(272 112) scale(0.7)" fill="#1c3b48"/><use href="#pine" transform="translate(190 112) scale(0.6)" fill="#183240"/><rect x="76" y="106" width="208" height="14" fill="#16382c"/><rect x="76" y="32" width="208" height="88" rx="14" fill="none" stroke="#4a5392" stroke-width="6"/>
