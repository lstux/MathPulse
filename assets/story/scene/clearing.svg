<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" preserveAspectRatio="xMidYMid slice">
  <title>La clairière</title>
  <desc>Une clairière au crépuscule. Un vaisseau argenté, cabossé, penché sur le côté, une aile tordue et un peu de fumée.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e0d2b"/><stop offset=".5" stop-color="#2b2370"/><stop offset=".85" stop-color="#6a4fc0"/><stop offset="1" stop-color="#d0689c"/></linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b8a5f"/><stop offset="1" stop-color="#1d4a3b"/></linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#a3abcf"/></linearGradient>
    <linearGradient id="hullLow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f97b8"/><stop offset="1" stop-color="#565d84"/></linearGradient>
    <path id="pine" d="M0 -62 L15 -32 H8 L21 -8 H10 L25 18 H-25 L-10 -8 H-21 L-8 -32 H-15Z M-4 18 H4 V34 H-4Z"/>
  </defs>
  <rect width="360" height="240" fill="url(#sky)"/>
  <g fill="#fff" opacity=".85"><circle cx="30" cy="22" r="1.2"/><circle cx="90" cy="40" r="1"/><circle cx="190" cy="16" r="1.2"/><circle cx="262" cy="30" r="1"/><circle cx="330" cy="18" r="1.2"/><circle cx="300" cy="62" r="1"/></g>
  <g><use href="#pine" transform="translate(-4 196) scale(1.0)" fill="#27405a"/><use href="#pine" transform="translate(40 196) scale(1.0)" fill="#27405a"/><use href="#pine" transform="translate(316 196) scale(1.0)" fill="#27405a"/><use href="#pine" transform="translate(352 196) scale(1.0)" fill="#27405a"/></g>
  <rect y="196" width="360" height="44" fill="url(#meadow)"/>
  <ellipse cx="184" cy="206" rx="104" ry="9" fill="#0d2a22" opacity=".45"/>
  <!-- vaisseau penché -->
  <g transform="rotate(-9 184 160)">
    <path d="M96 168 C94 138 130 120 184 120 C240 120 276 140 272 170 C268 188 240 196 184 196 C128 196 98 188 96 168Z" fill="url(#hull)"/>
    <path d="M98 172 C104 190 134 196 184 196 C236 196 266 190 272 172 C250 180 220 184 184 184 C146 184 118 180 98 172Z" fill="url(#hullLow)"/>
    <!-- hublot -->
    <path d="M140 140 C150 120 196 116 214 136 C196 142 160 146 140 140Z" fill="#7fc8ff"/>
    <path d="M150 134 C160 126 182 124 196 130" fill="none" stroke="#fff" stroke-width="3" opacity=".7" stroke-linecap="round"/>
    <!-- bosses et impacts -->
    <ellipse cx="236" cy="158" rx="14" ry="9" fill="#7c84a8" opacity=".6"/>
    <path d="M226 152 l8 4 l-4 6 l10 2" fill="none" stroke="#3d4468" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M110 166 h26 M118 174 h30" stroke="#8f97b8" stroke-width="3" stroke-linecap="round"/>
    <!-- aile tordue -->
    <path d="M246 164 L292 150 L304 166 L276 172 L296 190 L270 188Z" fill="#8f97b8"/>
    <path d="M246 164 L292 150" stroke="#eef0ff" stroke-width="3" stroke-linecap="round"/>
    <!-- aileron arrière -->
    <path d="M100 160 L82 136 L112 148Z" fill="#a3abcf"/>
  </g>
  <!-- fumée -->
  <g fill="#c9cfe6" opacity=".55"><circle cx="208" cy="106" r="9"/><circle cx="220" cy="90" r="12"/><circle cx="238" cy="72" r="15"/><circle cx="252" cy="50" r="10" opacity=".7"/></g>
  <!-- étincelles et débris -->
  <g fill="#ffd54a"><path d="M276 140 l3 -7 l3 7 l-7 -3 l8 0Z"/><path d="M292 158 l2 -5 l2 5 l-5 -2 l6 0Z"/></g>
  <g fill="#8f97b8"><rect x="130" y="208" width="9" height="5" rx="1.5" transform="rotate(-18 134 210)"/><rect x="238" y="212" width="12" height="6" rx="2" transform="rotate(14 244 215)"/><circle cx="104" cy="214" r="4"/></g>
  <g><use href="#pine" transform="translate(14 236) scale(2.2)" fill="#10282a"/><use href="#pine" transform="translate(346 236) scale(2.2)" fill="#10282a"/></g>
</svg>
