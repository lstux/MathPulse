<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" preserveAspectRatio="xMidYMid slice">
  <title>Le hublot : la Terre qui s'éloigne</title>
  <desc>Par le hublot, la Terre, toute bleue, rapetisse dans le noir.</desc>
  <style>@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}40%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.tw circle{animation:tw 2.6s ease-in-out infinite alternate}.tw circle:nth-child(3n){animation-duration:3.4s;animation-delay:-1s}.tw circle:nth-child(3n+1){animation-duration:2.1s;animation-delay:-.4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f3d"/><stop offset="1" stop-color="#262c58"/></linearGradient><linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3668"/><stop offset="1" stop-color="#1b1f3d"/></linearGradient><linearGradient id="sp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a26"/><stop offset=".6" stop-color="#2a1d6e"/><stop offset="1" stop-color="#5a3aa0"/></linearGradient><radialGradient id="earth" cx=".35" cy=".3"><stop offset="0" stop-color="#7fd0ff"/><stop offset=".55" stop-color="#2f7fd0"/><stop offset="1" stop-color="#173a7a"/></radialGradient><radialGradient id="eh"><stop offset=".8" stop-color="#7fd0ff" stop-opacity="0"/><stop offset="1" stop-color="#7fd0ff" stop-opacity=".45"/></radialGradient></defs>
  <rect width="360" height="240" fill="url(#wall)"/><rect y="190" width="360" height="50" fill="url(#floor)"/>
  <rect x="64" y="22" width="232" height="132" rx="22" fill="url(#sp)"/><g class="tw" fill="#fff" opacity=".9"><circle cx="171" cy="47" r="1.4"/><circle cx="339" cy="34" r="0.8"/><circle cx="280" cy="40" r="1.2"/><circle cx="304" cy="35" r="1"/><circle cx="25" cy="39" r="1.4"/><circle cx="220" cy="36" r="1"/><circle cx="52" cy="98" r="1.4"/><circle cx="36" cy="133" r="0.8"/><circle cx="120" cy="108" r="0.8"/><circle cx="301" cy="102" r="1.4"/><circle cx="31" cy="56" r="0.8"/><circle cx="291" cy="137" r="1"/><circle cx="154" cy="81" r="1"/><circle cx="282" cy="43" r="1.2"/><circle cx="292" cy="132" r="1"/><circle cx="58" cy="102" r="1"/><circle cx="196" cy="40" r="0.8"/><circle cx="294" cy="35" r="1"/><circle cx="260" cy="115" r="1.4"/><circle cx="166" cy="87" r="1.4"/><circle cx="191" cy="66" r="1"/><circle cx="98" cy="117" r="1"/></g><circle cx="222" cy="100" r="38.080000000000005" fill="url(#eh)"/><circle cx="222" cy="100" r="34" fill="url(#earth)"/><path d="M201.6 96.6 q10.2 -17.0 23.799999999999997 -10.2 q6.800000000000001 13.600000000000001 -6.800000000000001 20.4 q-10.2 3.4000000000000004 -17.0 -10.2Z" fill="#4fb36a" opacity=".85"/><path d="M228.8 110.2 q13.600000000000001 -6.800000000000001 17.0 3.4000000000000004 q-6.800000000000001 13.600000000000001 -17.0 3.4000000000000004Z" fill="#4fb36a" opacity=".85"/>
  <rect x="64" y="22" width="232" height="132" rx="22" fill="none" stroke="#4a5392" stroke-width="7"/>
