<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" preserveAspectRatio="xMidYMid slice">
  <title>La colline la nuit</title>
  <desc>Une colline sous les étoiles, avec une petite maison à la fenêtre éclairée.</desc>
  <style>@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}40%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.tw circle{animation:tw 2.6s ease-in-out infinite alternate}.tw circle:nth-child(3n){animation-duration:3.4s;animation-delay:-1s}.tw circle:nth-child(3n+1){animation-duration:2.1s;animation-delay:-.4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a26"/><stop offset=".65" stop-color="#2b2370"/><stop offset="1" stop-color="#4a4aa0"/></linearGradient><linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d6b4c"/><stop offset="1" stop-color="#16382c"/></linearGradient><path id="pine" d="M0 -62 L15 -32 H8 L21 -8 H10 L25 18 H-25 L-10 -8 H-21 L-8 -32 H-15Z M-4 18 H4 V34 H-4Z"/><radialGradient id="warm"><stop offset="0" stop-color="#ffd54a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd54a" stop-opacity="0"/></radialGradient><radialGradient id="rep"><stop offset="0" stop-color="#bfe6ff"/><stop offset=".4" stop-color="#5aa9ff" stop-opacity=".5"/><stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/></radialGradient></defs>
  <rect width="360" height="240" fill="url(#sky)"/><g class="tw" fill="#fff" opacity=".9"><circle cx="130" cy="11" r="1"/><circle cx="181" cy="71" r="0.8"/><circle cx="169" cy="30" r="1.2"/><circle cx="138" cy="103" r="1"/><circle cx="16" cy="95" r="1.4"/><circle cx="202" cy="52" r="1"/><circle cx="198" cy="34" r="1.2"/><circle cx="37" cy="63" r="1.2"/><circle cx="300" cy="46" r="1"/><circle cx="263" cy="67" r="1"/><circle cx="53" cy="34" r="1"/><circle cx="202" cy="51" r="1.4"/><circle cx="227" cy="39" r="0.8"/><circle cx="71" cy="4" r="1.4"/><circle cx="248" cy="75" r="1.4"/><circle cx="6" cy="9" r="1.4"/><circle cx="276" cy="109" r="1.4"/><circle cx="235" cy="31" r="0.8"/><circle cx="120" cy="19" r="1"/><circle cx="273" cy="87" r="0.8"/><circle cx="337" cy="108" r="1.4"/><circle cx="49" cy="70" r="0.8"/><circle cx="6" cy="100" r="1"/><circle cx="125" cy="72" r="0.8"/><circle cx="336" cy="91" r="1.2"/><circle cx="71" cy="80" r="1.2"/><circle cx="276" cy="81" r="1.4"/><circle cx="63" cy="12" r="0.8"/><circle cx="159" cy="67" r="1"/><circle cx="204" cy="33" r="1"/><circle cx="313" cy="0" r="0.8"/><circle cx="281" cy="38" r="1.4"/><circle cx="148" cy="40" r="1"/><circle cx="249" cy="67" r="1"/><circle cx="286" cy="31" r="0.8"/><circle cx="216" cy="90" r="1.2"/><circle cx="34" cy="2" r="1"/><circle cx="261" cy="113" r="1.4"/><circle cx="47" cy="32" r="1"/><circle cx="347" cy="54" r="1.2"/></g>
  <circle cx="300" cy="44" r="17" fill="#fdf1c4"/>
  <path d="M0 150 Q110 108 220 140 T360 128 V240 H0Z" fill="url(#hill)"/>
  <use href="#pine" transform="translate(30 150) scale(.9)" fill="#1c3b48"/><use href="#pine" transform="translate(330 150) scale(1)" fill="#1c3b48"/>
  <rect x="236" y="116" width="30" height="24" fill="#4a3a30"/><path d="M230 118 L251 100 L272 118Z" fill="#6a4a3a"/><rect x="245" y="124" width="10" height="16" rx="2" fill="#ffd54a"/><circle cx="250" cy="132" r="22" fill="url(#warm)" opacity=".5"/>
  <path d="M0 200 Q180 160 360 196 V240 H0Z" fill="#122f2e"/>
</svg>
