<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" preserveAspectRatio="xMidYMid slice">
  <title>La soute aux réservoirs</title>
  <desc>Une soute bleu nuit avec trois grands réservoirs reliés par un tuyau, tous remplis d'une lueur turquoise.</desc>
  <style>@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}40%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.tw circle{animation:tw 2.6s ease-in-out infinite alternate}.tw circle:nth-child(3n){animation-duration:3.4s;animation-delay:-1s}.tw circle:nth-child(3n+1){animation-duration:2.1s;animation-delay:-.4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.gl{animation:pulse 2.2s ease-in-out infinite alternate}</style><defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f3d"/><stop offset="1" stop-color="#262c58"/></linearGradient><linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3668"/><stop offset="1" stop-color="#1b1f3d"/></linearGradient><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe9ff"/><stop offset="1" stop-color="#4ade80"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#7fe9ff" stop-opacity=".35"/><stop offset="1" stop-color="#7fe9ff" stop-opacity="0"/></radialGradient></defs>
  <rect width="360" height="240" fill="url(#wall)"/>
  <g stroke="#323a72" stroke-width="2" fill="none"><path d="M0 40 H360 M0 190 H360"/><path d="M60 0 V40 M180 0 V40 M300 0 V40"/></g>
  <rect y="190" width="360" height="50" fill="url(#floor)"/>
  <g fill="none" stroke="#4a5392" stroke-width="5"><path d="M125 56 V40 M180 56 V40 M235 56 V40 M125 40 H235"/></g>
  <rect x="105" y="64" width="40" height="104" rx="12" fill="#12163a" stroke="#4a5392" stroke-width="3"/><rect x="109" y="72" width="32" height="92" rx="9" fill="url(#fill)"/><rect x="114" y="78" width="5" height="70" rx="2.5" fill="#fff" opacity=".35"/><circle class="gl" cx="125" cy="116" r="40" fill="url(#glow)"/><rect x="111" y="56" width="28" height="10" rx="3" fill="#4a5392"/><rect x="160" y="64" width="40" height="104" rx="12" fill="#12163a" stroke="#4a5392" stroke-width="3"/><rect x="164" y="72" width="32" height="92" rx="9" fill="url(#fill)"/><rect x="169" y="78" width="5" height="70" rx="2.5" fill="#fff" opacity=".35"/><circle class="gl" cx="180" cy="116" r="40" fill="url(#glow)"/><rect x="166" y="56" width="28" height="10" rx="3" fill="#4a5392"/><rect x="215" y="64" width="40" height="104" rx="12" fill="#12163a" stroke="#4a5392" stroke-width="3"/><rect x="219" y="72" width="32" height="92" rx="9" fill="url(#fill)"/><rect x="224" y="78" width="5" height="70" rx="2.5" fill="#fff" opacity=".35"/><circle class="gl" cx="235" cy="116" r="40" fill="url(#glow)"/><rect x="221" y="56" width="28" height="10" rx="3" fill="#4a5392"/>
  <rect x="140" y="196" width="80" height="22" rx="4" fill="#3a4380" stroke="#5864b0" stroke-width="2"/>
  <rect x="158" y="188" width="8" height="8" rx="2" fill="#7fe9ff"/><rect x="155" y="185" width="14" height="14" rx="4" fill="#7fe9ff" opacity=".25"/><rect x="170" y="192" width="8" height="8" rx="2" fill="#7fe9ff"/><rect x="167" y="189" width="14" height="14" rx="4" fill="#7fe9ff" opacity=".25"/><rect x="182" y="188" width="8" height="8" rx="2" fill="#7fe9ff"/><rect x="179" y="185" width="14" height="14" rx="4" fill="#7fe9ff" opacity=".25"/><rect x="194" y="192" width="8" height="8" rx="2" fill="#7fe9ff"/><rect x="191" y="189" width="14" height="14" rx="4" fill="#7fe9ff" opacity=".25"/><rect x="164" y="180" width="8" height="8" rx="2" fill="#7fe9ff"/><rect x="161" y="177" width="14" height="14" rx="4" fill="#7fe9ff" opacity=".25"/><rect x="188" y="180" width="8" height="8" rx="2" fill="#7fe9ff"/><rect x="185" y="177" width="14" height="14" rx="4" fill="#7fe9ff" opacity=".25"/>
</svg>
