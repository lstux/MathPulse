<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" preserveAspectRatio="xMidYMid slice">
  <title>L'intérieur du vaisseau</title>
  <desc>Une cabine de vaisseau bleu nuit. Un grand panneau de voyants presque tous éteints, et sept modules alignés, chacun avec deux piles.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f3d"/><stop offset="1" stop-color="#262c58"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3668"/><stop offset="1" stop-color="#1b1f3d"/></linearGradient>
  </defs>
  <rect width="360" height="240" fill="url(#wall)"/>
  <g stroke="#323a72" stroke-width="2" fill="none"><path d="M0 40 H360 M0 190 H360"/><path d="M60 0 V40 M180 0 V40 M300 0 V40"/></g>
  <rect y="190" width="360" height="50" fill="url(#floor)"/>
  <!-- voyant de secours -->
  <circle cx="28" cy="26" r="7" fill="#a23a4a"/><circle cx="28" cy="26" r="15" fill="#a23a4a" opacity=".22"/>
  <!-- hublot -->
  <circle cx="326" cy="52" r="24" fill="#12163a" stroke="#4a5392" stroke-width="5"/>
  <g fill="#fff" opacity=".85"><circle cx="318" cy="46" r="1.4"/><circle cx="332" cy="58" r="1.2"/><circle cx="324" cy="62" r="1"/><circle cx="334" cy="42" r="1"/></g>
  <!-- console -->
  <rect x="78" y="62" width="204" height="62" rx="9" fill="#2a3160" stroke="#4a5392" stroke-width="3"/>
  
  <circle cx="96" cy="84" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/><circle cx="126" cy="84" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/><circle cx="156" cy="84" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/><circle cx="186" cy="84" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/><circle cx="216" cy="84" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/><circle cx="246" cy="84" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/><circle cx="96" cy="104" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/><circle cx="126" cy="104" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/><circle cx="156" cy="104" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/><circle cx="186" cy="104" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/><circle cx="216" cy="104" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/><circle cx="246" cy="104" r="6" fill="#2b3160" stroke="#4a5392" stroke-width="1.5"/>
  <rect x="86" y="130" width="188" height="6" rx="3" fill="#323a72"/>
  <!-- établi et sept modules de deux piles -->
  <rect x="96" y="168" width="168" height="8" rx="3" fill="#4a5392"/>
  <rect x="103" y="150" width="18" height="20" rx="3" fill="#3a4380" stroke="#5864b0" stroke-width="1.2"/><rect x="106" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="113" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="125" y="150" width="18" height="20" rx="3" fill="#3a4380" stroke="#5864b0" stroke-width="1.2"/><rect x="128" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="135" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="147" y="150" width="18" height="20" rx="3" fill="#3a4380" stroke="#5864b0" stroke-width="1.2"/><rect x="150" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="157" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="169" y="150" width="18" height="20" rx="3" fill="#3a4380" stroke="#5864b0" stroke-width="1.2"/><rect x="172" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="179" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="191" y="150" width="18" height="20" rx="3" fill="#3a4380" stroke="#5864b0" stroke-width="1.2"/><rect x="194" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="201" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="213" y="150" width="18" height="20" rx="3" fill="#3a4380" stroke="#5864b0" stroke-width="1.2"/><rect x="216" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="223" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="235" y="150" width="18" height="20" rx="3" fill="#3a4380" stroke="#5864b0" stroke-width="1.2"/><rect x="238" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/><rect x="245" y="154" width="5" height="12" rx="1.5" fill="#9fd4ff"/>
</svg>
