<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" preserveAspectRatio="xMidYMax meet" role="img" aria-labelledby="ia-t">
  <title id="ia-t">Un vaisseau s'écrase dans la forêt, la nuit ; au loin, une petite lampe bleue s'allume</title>
  <!-- Intro animée (une seule lecture, sans parole) : un vaisseau tombe dans la forêt, une petite lampe bleue s'allume. Le renard et la lapine arrivent dans la scène du chapitre 1.
       Chargée en ligne par l'application pour que l'animation redémarre à chaque affichage. Tout est préfixé « ia- » (pas de conflit CSS). -->
  <style>
    #ia-scene { animation: ia-shake .6s linear 2.05s 1; }
    .ia-fall { transform-origin: 192px 312px; animation: ia-fall 1.7s cubic-bezier(.45,.1,.75,1) .4s backwards; }
    .ia-flame { opacity: 0; animation: ia-flame 2.4s ease-out .4s both; }
    .ia-shadow { animation: ia-fade .6s ease-out 1.8s backwards; }
    .ia-dust ellipse { opacity: 0; transform-box: fill-box; transform-origin: 50% 80%; animation: ia-dust 1.1s ease-out 2.1s both; }
    .ia-dust ellipse:nth-child(2) { animation-delay: 2.18s; } .ia-dust ellipse:nth-child(3) { animation-delay: 2.26s; }
    .ia-smoke { animation: ia-fade 1s ease-out 2.4s backwards, ia-float 3s ease-in-out 3.4s infinite alternate; }
    .ia-sparks { animation: ia-fade .1s linear 2.2s backwards, ia-flicker .5s steps(2, end) 2.4s infinite; }
    .ia-lamp { animation: ia-fade 1.2s ease-out 3s backwards, ia-pulse 2.4s ease-in-out 4.2s infinite alternate; }
    .ia-crack { animation: ia-fade .1s linear 2.1s backwards; }
    @keyframes ia-fall { 0% { transform: translate(240px,-540px) rotate(-30deg) scale(.45); } 80% { transform: translate(6px,-10px) rotate(7deg) scale(1.03); } 100% { transform: none; } }
    @keyframes ia-flame { 0% { opacity: 0; } 12% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ia-shake { 0%,100% { transform: translate(0,0); } 12% { transform: translate(-7px,5px); } 28% { transform: translate(6px,-4px); } 44% { transform: translate(-5px,3px); } 62% { transform: translate(3px,-2px); } 80% { transform: translate(-2px,1px); } }
    @keyframes ia-dust { 0% { opacity: .85; transform: scale(.25); } 100% { opacity: 0; transform: scale(2.4) translateY(-10px); } }
    @keyframes ia-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ia-pulse { from { opacity: 1; } to { opacity: .55; } }
    @keyframes ia-float { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    @keyframes ia-flicker { 0% { opacity: 1; } 100% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { #ia-scene, #ia-scene * { animation: none !important; } .ia-flame, .ia-dust ellipse { opacity: 0 !important; } }
  </style>
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="400">
      <stop offset="0" stop-color="#0e0d2b"/>
      <stop offset=".55" stop-color="#2b2370"/>
      <stop offset=".85" stop-color="#6a4fc0"/>
      <stop offset="1" stop-color="#d0689c"/>
    </linearGradient>
    <linearGradient id="meadow" gradientUnits="userSpaceOnUse" x1="0" y1="350" x2="0" y2="440">
      <stop offset="0" stop-color="#3b8a5f"/>
      <stop offset="1" stop-color="#1d4a3b"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0ff"/>
      <stop offset="1" stop-color="#a3abcf"/>
    </linearGradient>
    <linearGradient id="hullLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f97b8"/>
      <stop offset="1" stop-color="#565d84"/>
    </linearGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#fdf1c4" stop-opacity=".35"/><stop offset="1" stop-color="#fdf1c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowYellow"><stop offset="0" stop-color="#fff3a0" stop-opacity=".8"/><stop offset="1" stop-color="#fff3a0" stop-opacity="0"/></radialGradient>
    <mask id="crescent">
      <rect width="360" height="520" fill="#fff"/>
      <circle cx="76" cy="58" r="20" fill="#000"/>
    </mask>
    <path id="sparkle" d="M0-6 L1.6-1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6-1.6Z"/>
    <g id="pine">
      <rect x="-3" y="-10" width="6" height="10"/>
      <path d="M0-100 L16-62 L-16-62Z M0-80 L21-36 L-21-36Z M0-58 L26-8 L-26-8Z"/>
    </g>
    <radialGradient id="lampGlow"><stop offset="0" stop-color="#bfe6ff" stop-opacity=".9"/><stop offset=".35" stop-color="#5aa9ff" stop-opacity=".4"/><stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="flameGrad" gradientUnits="userSpaceOnUse" x1="200" y1="300" x2="320" y2="150">
      <stop offset="0" stop-color="#fff3a0" stop-opacity=".95"/><stop offset=".4" stop-color="#ff9a3c" stop-opacity=".7"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g id="ia-scene">
  <!-- Ciel -->
  <rect width="360" height="520" fill="url(#sky)"/>
  <g fill="#fff6d6">
    <circle cx="24" cy="28" r="1.2" opacity=".9"/><circle cx="52" cy="110" r="1" opacity=".7"/>
    <circle cx="96" cy="40" r="1.4" opacity=".95"/><circle cx="120" cy="88" r="1" opacity=".6"/>
    <circle cx="150" cy="22" r="1.2" opacity=".8"/><circle cx="176" cy="66" r="1" opacity=".7"/>
    <circle cx="205" cy="36" r="1.6"/><circle cx="238" cy="98" r="1" opacity=".6"/>
    <circle cx="262" cy="52" r="1.2" opacity=".85"/><circle cx="300" cy="24" r="1" opacity=".7"/>
    <circle cx="326" cy="92" r="1.3" opacity=".9"/><circle cx="344" cy="48" r="1" opacity=".7"/>
    <circle cx="18" cy="150" r="1" opacity=".6"/><circle cx="88" cy="160" r="1.2" opacity=".7"/>
    <circle cx="140" cy="140" r="1" opacity=".5"/><circle cx="318" cy="150" r="1" opacity=".6"/>
    <circle cx="352" cy="120" r="1.2" opacity=".8"/><circle cx="40" cy="76" r="1" opacity=".6"/>
    <circle cx="190" cy="124" r="1" opacity=".5"/><circle cx="282" cy="132" r="1" opacity=".55"/>
    <use href="#sparkle" transform="translate(116 58)" opacity=".9"/>
    <use href="#sparkle" transform="translate(240 72) scale(.8)" opacity=".8"/>
    <use href="#sparkle" transform="translate(326 64) scale(.6)" opacity=".7"/>
  </g>
  <circle cx="66" cy="66" r="44" fill="url(#moonGlow)"/>
  <circle cx="66" cy="66" r="22" fill="#fdf1c4" mask="url(#crescent)"/>

  <g id="ia-landscape" transform="translate(0 80)">
  <g id="landscape" transform="translate(0 80)">
  <!-- Collines et forêt lointaine -->
  <path d="M0 262 C60 232 120 252 180 242 S300 226 360 250 L360 440 L0 440Z" fill="#2a2a6b" opacity=".95"/>
  <g fill="#1c3a55">
    <use href="#pine" transform="translate(14 296) scale(.7)"/><use href="#pine" transform="translate(52 290) scale(.85)"/>
    <use href="#pine" transform="translate(96 298) scale(.65)"/><use href="#pine" transform="translate(136 292) scale(.8)"/>
    <use href="#pine" transform="translate(300 292) scale(.85)"/><use href="#pine" transform="translate(338 298) scale(.7)"/>
  </g>
  <path d="M0 322 C70 304 150 316 220 310 S330 300 360 308 L360 440 L0 440Z" fill="#2a5f4d"/>
  <g fill="#1f5a4a">
    <use href="#pine" transform="translate(74 330) scale(1.05)"/><use href="#pine" transform="translate(112 326) scale(.8)"/>
    <use href="#pine" transform="translate(318 328) scale(1.1)"/>
  </g>
  <!-- Grands sapins qui encadrent la scène -->
  <g fill="#0f2a22">
    <use href="#pine" transform="translate(6 430) scale(2.1)"/>
    <use href="#pine" transform="translate(356 430) scale(1.9)"/>
  </g>

  <ellipse class="ia-shadow" cx="192" cy="333" rx="66" ry="7" fill="#0b1a14" opacity=".4"/>
  <g class="ia-fall">
    <g class="ia-flame"><path d="M205 296 L330 140 L352 176 L222 326Z" fill="url(#flameGrad)"/><path d="M196 304 L262 214" stroke="#fff3a0" stroke-width="5" stroke-linecap="round" opacity=".8"/></g>
  <g transform="translate(192 312) rotate(-8) scale(1.0)">
    <g stroke="#454b6e" stroke-width="5" stroke-linecap="round"><path d="M-40 12 L-46 24"/><path d="M40 12 L50 22"/></g>
    <ellipse cx="0" cy="7" rx="62" ry="18" fill="url(#hullLow)"/>
    <path d="M-30-4 C-30-40 30-40 30-4Z" fill="#9be7ff" fill-opacity=".85" stroke="#d6f6ff" stroke-width="2"/>
    <path d="M-20-12 C-18-24 -8-30 2-30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="0" cy="0" rx="62" ry="17" fill="url(#hull)"/>
    <circle cx="-44" cy="2" r="3.5" fill="#ff8fc0"/><circle cx="-22" cy="5" r="3.5" fill="#7a809f"/>
    <circle cx="0" cy="6" r="3.5" fill="#fbbf24"/><circle cx="22" cy="5" r="3.5" fill="#7a809f"/>
    <circle cx="44" cy="2" r="3.5" fill="#5eead4"/>
    <path class="ia-crack" d="M-34-12 L-28-5 L-35-1 L-29 7" fill="none" stroke="#454b6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="ia-sparks" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"><path d="M-44-16 L-50-22"/><path d="M-47-6 L-55-8"/><path d="M-36-20 L-35-28"/></g>
    <g class="ia-smoke" fill="#8a86b8"><circle cx="-26" cy="-28" r="6" opacity=".55"/><circle cx="-30" cy="-42" r="8" opacity=".4"/><circle cx="-24" cy="-58" r="10" opacity=".28"/></g>
  </g>

  </g>
  <g class="ia-dust" fill="#cfc6e8">
    <ellipse cx="150" cy="338" rx="22" ry="8"/><ellipse cx="236" cy="338" rx="26" ry="9"/><ellipse cx="192" cy="344" rx="30" ry="10"/>
  </g>
  <!-- Prairie -->
  <path d="M0 358 C70 346 150 360 210 356 S320 346 360 352 L360 440 L0 440Z" fill="url(#meadow)"/>
  <g stroke="#4aa56f" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M30 432 q-2-10-5-14 M30 432 q0-12 1-17 M30 432 q3-9 6-12"/>
    <path d="M150 428 q-2-10-5-14 M150 428 q0-12 1-17 M150 428 q3-9 6-12"/>
    <path d="M232 434 q-2-10-5-14 M232 434 q0-12 1-17 M232 434 q3-9 6-12"/>
    <path d="M334 430 q-2-10-5-14 M334 430 q0-12 1-17 M334 430 q3-9 6-12"/>
  </g>
  <g><circle cx="190" cy="418" r="3" fill="#fff"/><circle cx="190" cy="418" r="1.2" fill="#fbbf24"/>
     <circle cx="252" cy="394" r="3" fill="#ffb8d6"/><circle cx="252" cy="394" r="1.2" fill="#fbbf24"/>
     <circle cx="46" cy="422" r="3" fill="#ffb8d6"/><circle cx="46" cy="422" r="1.2" fill="#fbbf24"/></g>
  <g>
    <circle cx="150" cy="372" r="7" fill="url(#glowYellow)"/><circle cx="150" cy="372" r="1.8" fill="#fff9c4"/>
    <circle cx="232" cy="384" r="7" fill="url(#glowYellow)"/><circle cx="232" cy="384" r="1.8" fill="#fff9c4"/>
    <circle cx="182" cy="398" r="7" fill="url(#glowYellow)"/><circle cx="182" cy="398" r="1.8" fill="#fff9c4"/>
    <circle cx="62" cy="380" r="7" fill="url(#glowYellow)"/><circle cx="62" cy="380" r="1.8" fill="#fff9c4"/>
    <circle cx="336" cy="372" r="7" fill="url(#glowYellow)"/><circle cx="336" cy="372" r="1.8" fill="#fff9c4"/>
  </g>

  </g>

  </g>
  <!-- La petite lampe bleue de la lapine s'allume dans les bois (c'est elle que le renard verra au chapitre 1) -->
  <g class="ia-lamp"><circle cx="262" cy="404" r="40" fill="url(#lampGlow)"/><circle cx="262" cy="404" r="4" fill="#e8f6ff"/></g>
  </g>
</svg>
