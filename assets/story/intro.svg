    <circle cx="336" cy="372" r="7" fill="url(#glowYellow)"/><circle cx="336" cy="372" r="1.8" fill="#fff9c4"/>
  </g>

  <!-- Bulle : le test de la lapine -->
  <path d="M238 262 L284 318 L256 262Z" fill="#fff"/>
  <rect x="140" y="214" width="120" height="52" rx="16" fill="#fff"/>
  <text x="200" y="249" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="800" fill="#1a1a2e">2 + 3 = ?</text>

