<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="t d">
  <title id="t">Le renard rencontre la lapine venue d'ailleurs</title>
  <desc id="d">Une nuit étoilée dans les bois. Un petit renard au foulard rose fait face à une lapine extraterrestre à antennes lumineuses, qui tient une clé à molette devant son vaisseau en panne qui fume. Elle lui propose un test : « 2 + 3 = ? ».</desc>

  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="320">
      <stop offset="0" stop-color="#0e0d2b"/>
      <stop offset=".55" stop-color="#2b2370"/>
      <stop offset=".85" stop-color="#6a4fc0"/>
      <stop offset="1" stop-color="#d0689c"/>
    </linearGradient>
    <linearGradient id="meadow" gradientUnits="userSpaceOnUse" x1="0" y1="350" x2="0" y2="440">
      <stop offset="0" stop-color="#3b8a5f"/>
      <stop offset="1" stop-color="#1d4a3b"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0ff"/>
      <stop offset="1" stop-color="#a3abcf"/>
    </linearGradient>
    <linearGradient id="hullLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f97b8"/>
      <stop offset="1" stop-color="#565d84"/>
    </linearGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#fdf1c4" stop-opacity=".35"/><stop offset="1" stop-color="#fdf1c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowCyan"><stop offset="0" stop-color="#5eead4" stop-opacity=".75"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowPink"><stop offset="0" stop-color="#ff8fc0" stop-opacity=".75"/><stop offset="1" stop-color="#ff8fc0" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowYellow"><stop offset="0" stop-color="#fff3a0" stop-opacity=".8"/><stop offset="1" stop-color="#fff3a0" stop-opacity="0"/></radialGradient>
    <mask id="crescent">
      <rect width="360" height="440" fill="#fff"/>
      <circle cx="76" cy="58" r="20" fill="#000"/>
    </mask>
    <path id="sparkle" d="M0-6 L1.6-1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6-1.6Z"/>
